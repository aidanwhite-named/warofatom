<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethelgard 카드 공방</title>
<style>
  :root {
    --bg: #14161c; --panel: #1d2029; --line: #2e3340; --text: #e7e9ee; --dim: #8b92a3;
    --union: #e08a3c; --covalent: #4a90d9; --decay: #9b6bd6;
    --ok: #52b788; --warn: #e9c46a; --bad: #e76f51;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, 'Malgun Gothic', sans-serif; }
  h1 { font-size: 18px; margin: 0; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  main { display: grid; grid-template-columns: 250px 640px 280px; justify-content: start; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1240px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  section h2 { font-size: 13px; color: var(--dim); margin: 0 0 10px; font-weight: 600; letter-spacing: .03em; }
  label { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--dim); }
  input, select, button, textarea { font: inherit; color: var(--text); background: #12141a; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
  input[type=number] { width: 100%; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .pair label { grid-template-columns: 44px 1fr; }
  .slim { padding: 10px 12px; }
  .eq { display: grid; grid-template-columns: 52px 10px 64px auto; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--dim); }
  .eq span { color: var(--text); } .eq small { color: var(--dim); }
  .w { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .w b { display: block; font-size: 12px; font-weight: 600; } .w small { display: block; font-size: 11px; color: var(--dim); }
  .w input { width: 58px; flex: none; }
  .slim .verdict { margin: 6px 0 0; font-size: 13px; }
  .slim .gauge { height: 10px; }
  .slim details { margin-top: 6px; } .slim details + details { margin-top: 8px; }
  input[type=file] { padding: 3px; font-size: 12px; width: 0; }
  button { cursor: pointer; background: #272b37; }
  button:hover { border-color: var(--dim); }
  button.on { background: #3a4a7a; border-color: #6c86d9; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .seg { display: flex; gap: 0; margin-bottom: 12px; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .hint { color: var(--dim); font-size: 12px; margin: 4px 0 10px; }
  .fx { display: grid; grid-template-columns: 1fr 64px 28px; gap: 6px; margin-bottom: 4px; }
  .fx .flags { grid-column: 1 / -1; display: flex; gap: 12px; color: var(--dim); font-size: 12px; margin-bottom: 8px; align-items: center; }
  .fx .flags label { display: flex; gap: 4px; margin: 0; }
  .fx input[type=checkbox] { width: auto; }
  .fx .buff { display: flex; gap: 4px; }

  /* 카드 */
  .card { zoom: 2; --accent: var(--union); width: 300px; height: 440px; margin: 0 auto; border-radius: 16px; padding: 10px; position: relative;
    background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 55%, #000), #15171d 70%); border: 2px solid var(--accent);
    box-shadow: 0 8px 30px #0008; display: flex; flex-direction: column; gap: 6px; }
  .card.union { --accent: var(--union); } .card.covalent { --accent: var(--covalent); } .card.decay { --accent: var(--decay); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .lv { width: 38px; height: 38px; border-radius: 50%; background: #0c0d11; border: 2px solid var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
  .lv.over { border-color: var(--bad); color: var(--bad); }
  .nm { flex: 1; font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .el { font-weight: 700; color: var(--accent); }
  .art { flex: none; height: 178px; border-radius: 10px; background: #0c0d11 center/cover no-repeat; border: 1px solid #0006; display: grid; place-items: center; cursor: pointer; overflow: hidden; position: relative; }
  .art .sym { font-size: 84px; font-weight: 800; color: color-mix(in srgb, var(--accent) 70%, #fff); opacity: .55; }
  .art .empty { position: absolute; bottom: 6px; font-size: 11px; color: var(--dim); }
  .type { font-size: 12px; color: #cfd3dc; display: flex; justify-content: space-between; }
  .rules { flex: 1; background: #0c0d11cc; border-radius: 8px; padding: 8px 10px; font-size: 13px; overflow: hidden; }
  .rules div + div { margin-top: 3px; }
  .kw { color: var(--warn); }
  .body { flex: 1; display: flex; gap: 6px; min-height: 0; }
  .main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .stats { flex: none; width: 44px; display: flex; flex-direction: column; gap: 6px; }
  .stat { height: 52px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; line-height: 1; border: 2px solid #0008; }
  .stat small { font-size: 9px; font-weight: 600; opacity: .85; margin-bottom: 3px; }
  .stat.atk { background: #b8372b; } .stat.hp { background: #2e8b57; }
  .stat.upk { background: #0c0d11; border-color: var(--warn); color: var(--warn); }
  .stat.arm { background: #5a6270; } .stat.res { background: #3d5f8a; } .stat.chg { background: #b58a1e; }
  .desc { color: #a9afbd; font-style: italic; margin-top: 6px !important; padding-top: 6px; border-top: 1px solid #ffffff1a; }

  /* 점수 */
  .gauge { height: 18px; background: #12141a; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); }
  .gauge i { display: block; height: 100%; background: var(--ok); transition: width .15s; }
  .gauge.over i { background: var(--bad); }
  .verdict { margin: 8px 0; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  td:first-child, th:first-child { text-align: left; }
  tr.click { cursor: pointer; } tr.click:hover { background: #ffffff0d; }
  .pos { color: var(--bad); } .neg { color: var(--dim); } .ok { color: var(--ok); }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--dim); }
  pre { background: #0c0d11; padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; margin: 6px 0; white-space: pre-wrap; word-break: break-all; }
  .scroll { max-height: 360px; overflow: auto; }
</style>
</head>
<body>
<header>
  <h1>Aethelgard 카드 공방</h1>
  <span class="hint" style="margin:0">왼쪽에서 카드 정보·능력을, 오른쪽에서 스탯을 넣으면 레벨과 예산이 계산됩니다.</span>
</header>
<main>
  <section id="editor"></section>
  <section id="preview"></section>
  <div style="display:grid;gap:12px" id="side"></div>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
